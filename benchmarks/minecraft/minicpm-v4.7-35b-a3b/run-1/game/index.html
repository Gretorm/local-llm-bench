<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniCraft - Minecraft Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-shadow: 0 0 2px black;
            z-index: 10;
        }
        #hotbar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border: 2px solid #555;
            pointer-events: auto;
        }
        .hotbar-slot {
            width: 40px;
            height: 40px;
            border: 2px solid #333;
            background: rgba(50, 50, 50, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        .hotbar-slot.active {
            border-color: #fff;
            box-shadow: 0 0 5px white;
        }
        .hotbar-slot .count {
            position: absolute;
            bottom: 2px;
            right: 2px;
            color: white;
            font-size: 12px;
            text-shadow: 1px 1px 1px black;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 4px;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            z-index: 100;
            pointer-events: auto;
        }
        #instructions h1 { margin-bottom: 15px; color: #4CAF50; }
        #instructions p { margin: 8px 0; }
        #instructions button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #instructions button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="crosshair">+</div>
        <div id="info">
            <div id="fps">FPS: 0</div>
            <div id="coords">X: 0 Y: 0 Z: 0</div>
            <div id="block-info">Block: Air</div>
        </div>
        <div id="hotbar"></div>
        <div id="instructions">
            <h1>MiniCraft</h1>
            <p>A Minecraft Clone in Your Browser</p>
            <p><strong>Controls:</strong></p>
            <p>WASD - Move | Mouse - Look</p>
            <p>Left Click - Break Block</p>
            <p>Right Click - Place Block</p>
            <p>1-9 - Select Block</p>
            <p>Space - Jump | Shift - Sprint</p>
            <button id="start-btn">Click to Play</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="src/game.js"></script>
</body>
</html>
